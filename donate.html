<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate | Echo Sign</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">

    <div id="header-placeholder"></div>

    <section id="donate" class="pt-40 pb-24 bg-rose-50 relative overflow-hidden min-h-screen flex items-center">
        <div class="absolute top-0 right-0 w-64 h-64 bg-rose-100 rounded-full blur-3xl opacity-60 translate-x-1/2 -translate-y-1/2"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="bg-white rounded-[3rem] shadow-xl overflow-hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2">
                    <div class="p-12 lg:p-20 flex flex-col justify-center">
                        <h2 class="text-4xl font-bold text-gray-800 mb-6" data-i18n="donate_title">成為共融推手，<br>讓改變發生</h2>
                        <p class="text-lg text-gray-600 mb-8" data-i18n="donate_desc">
                            您的每一筆支持，都將化為身心障礙家庭的一盒手語圖卡，或是社群上的一張教學圖卡。
                        </p>
                        
                        <div class="space-y-4 mb-10">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 flex-shrink-0">
                                    <i data-lucide="book-open" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-800">NT$ 800</p>
                                    <p class="text-sm text-gray-500" data-i18n="donate_item_1">贊助一盒手語圖卡給身心障礙家庭</p>
                                </div>
                            </div>
                            <!-- <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-rose-100 flex items-center justify-center text-rose-500 flex-shrink-0">
                                    <i data-lucide="heart-handshake" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-gray-800">NT$ 1,200</p>
                                    <p class="text-sm text-gray-500" data-i18n="donate_item_2">贊助一場偏鄉手語教學</p>
                                </div>
                            </div> -->
                        </div>

                        <button class="gradient-btn text-white w-full sm:w-auto px-8 py-4 rounded-full text-lg font-bold shadow-lg" data-i18n="donate_btn">
                            立即捐款支持
                        </button>
                    </div>
                    
                    <div class="bg-gray-200 h-96 lg:h-auto relative">
                        <img src="image/pKyS4T.jpg" alt="Child learning sign language" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-rose-900/40 to-transparent"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
