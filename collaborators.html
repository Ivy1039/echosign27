<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborators | Echo Sign</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh flex flex-col min-h-screen">

    <div id="header-placeholder"></div>

    <main class="flex-grow bg-rose-50/50">
        <section class="pt-32 pb-12 bg-rose-50/50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <span class="text-rose-500 font-bold tracking-wider uppercase text-sm block mb-3">Our Collaborators</span>
                <h1 class="text-4xl lg:text-5xl font-bold text-gray-800" data-i18n="collaborators_title">合作夥伴</h1>
                <!-- <p class="mt-4 text-lg text-gray-600 max-w-2xl mx-auto leading-relaxed" data-i18n="collaborators_subtitle">
                    感謝以下品牌與組織的支持，與我們攜手打破溝通隔閡，創造聾聽共融的溫暖世界。
                </p> -->
            </div>
        </section>

        <section class="pb-32 bg-rose-50/50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8 md:space-y-12">
                <div class="flex flex-wrap justify-center gap-8 md:gap-16">
                    <div class="w-60 h-60 md:w-80 md:h-80 flex items-center justify-center group cursor-pointer">
                        <img src="image/Dream Golf Academy.png" alt="Dream Golf Academy" class="max-w-full max-h-full object-contain grayscale group-hover:grayscale-0 opacity-70 group-hover:opacity-100 transition-all duration-500">
                    </div>
                    <div class="w-60 h-60 md:w-80 md:h-80 flex items-center justify-center group cursor-pointer">
                        <img src="image/Nike.png" alt="Nike" class="max-w-full max-h-full object-contain grayscale group-hover:grayscale-0 opacity-70 group-hover:opacity-100 transition-all duration-500">
                    </div>
                    <div class="w-60 h-60 md:w-80 md:h-80 flex items-center justify-center group cursor-pointer">
                        <img src="image/TASLI.png" alt="TASLI 台灣手語翻譯協會" class="max-w-full max-h-full object-contain grayscale group-hover:grayscale-0 opacity-70 group-hover:opacity-100 transition-all duration-500">
                    </div>

                </div>

                <div class="flex flex-wrap justify-center gap-8 md:gap-16">
                    <div class="w-60 h-60 md:w-80 md:h-80 flex items-center justify-center group cursor-pointer">
                        <img src="image/WA!COOKIES.png" alt="WA!COOKIES" class="max-w-full max-h-full object-contain grayscale group-hover:grayscale-0 opacity-70 group-hover:opacity-100 transition-all duration-500">
                    </div>
                    <div class="w-60 h-60 md:w-80 md:h-80 flex items-center justify-center group cursor-pointer">
                        <img src="image/UDN.png" alt="UDN 聯合新聞網" class="max-w-full max-h-full object-contain grayscale group-hover:grayscale-0 opacity-70 group-hover:opacity-100 transition-all duration-500">
                    </div>

                </div>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
