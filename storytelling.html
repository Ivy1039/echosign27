<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storytelling Program | Echo Sign</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">

    <div id="header-placeholder"></div>

    <section class="pt-32 pb-24 bg-orange-50/30 min-h-screen relative overflow-hidden">
        <div class="absolute top-20 right-10 w-72 h-72 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
        <div class="absolute bottom-20 left-10 w-72 h-72 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            
            <div class="text-center mb-16">
                <span class="text-rose-500 font-bold tracking-wider uppercase text-sm">Our Lesson Plans</span>
                <h1 class="text-4xl lg:text-5xl font-bold text-gray-800 mt-2 mb-6" data-i18n="story_page_title">親子手語故事屋</h1>
                <p class="text-lg text-gray-600 max-w-3xl mx-auto leading-relaxed" data-i18n="story_page_desc">
                    這裡有我們最新製作的雙語教案！這些簡報專為聽障家庭設計，每次能提供 1-2 小時的互動故事體驗，同時幫助孩子們學習基礎英文單字。
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-10">

                <div onclick="openPDF('storytelling_pdf/01-小瑪菲小姐.pdf')" class="group block cursor-pointer">
                    <div class="bg-white p-3 md:p-4 rounded-[2rem] shadow-lg border-4 border-orange-50 hover:shadow-2xl hover:border-rose-100 hover:-translate-y-2 transition-all duration-500">
                        <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-gray-50 border border-gray-100">
                            <img src="image\echosign_logo_circle.png" alt="小瑪菲小姐封面" class="w-full h-full object-cover">
                            
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-[2px]">
                                <span class="bg-white text-gray-800 px-6 py-3 rounded-full font-bold shadow-xl flex items-center gap-2 transform scale-90 group-hover:scale-100 transition-transform duration-300">
                                    <i data-lucide="play-circle" class="w-5 h-5 text-rose-500"></i> 開啟投影片
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <div onclick="openPDF('storytelling_pdf/2-金髮女孩與三隻熊_魔法ABC.pdf')" class="group block cursor-pointer">
                    <div class="bg-white p-3 md:p-4 rounded-[2rem] shadow-lg border-4 border-orange-50 hover:shadow-2xl hover:border-rose-100 hover:-translate-y-2 transition-all duration-500">
                        <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-gray-50 border border-gray-100">
                            <img src="image\echosign_logo_circle.png" alt="金髮女孩與三隻熊封面" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-[2px]">
                                <span class="bg-white text-gray-800 px-6 py-3 rounded-full font-bold shadow-xl flex items-center gap-2 transform scale-90 group-hover:scale-100 transition-transform duration-300">
                                    <i data-lucide="play-circle" class="w-5 h-5 text-rose-500"></i> 開啟投影片
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <div onclick="openPDF('storytelling_pdf/3-魔法ABA灰姑娘_投影片.pdf')" class="group block cursor-pointer">
                    <div class="bg-white p-3 md:p-4 rounded-[2rem] shadow-lg border-4 border-orange-50 hover:shadow-2xl hover:border-rose-100 hover:-translate-y-2 transition-all duration-500">
                        <div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-gray-50 border border-gray-100">
                            <img src="image\echosign_logo_circle.png" alt="灰姑娘封面" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-[2px]">
                                <span class="bg-white text-gray-800 px-6 py-3 rounded-full font-bold shadow-xl flex items-center gap-2 transform scale-90 group-hover:scale-100 transition-transform duration-300">
                                    <i data-lucide="play-circle" class="w-5 h-5 text-rose-500"></i> 開啟投影片
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <div id="pdf-modal" class="fixed inset-0 z-[100] bg-black/80 hidden flex-col items-center justify-center backdrop-blur-md transition-opacity duration-300 opacity-0">
        <div class="w-full max-w-5xl flex justify-end p-4">
            <button onclick="closePDF()" class="text-white hover:text-rose-400 transition-colors flex items-center gap-2 font-bold text-lg">
                <i data-lucide="x-circle" class="w-8 h-8"></i> 關閉閱讀
            </button>
        </div>
        <div class="w-full max-w-5xl h-[80vh] bg-white rounded-2xl overflow-hidden shadow-2xl relative">
            <iframe id="pdf-frame" src="" class="w-full h-full border-0" title="PDF Viewer"></iframe>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>

    <script>
        function openPDF(pdfPath) {
            const modal = document.getElementById('pdf-modal');
            const frame = document.getElementById('pdf-frame');
            
            // 設定 iframe 的來源，#toolbar=0 可以隱藏部分瀏覽器預設的 PDF 工具列，讓畫面更乾淨
            frame.src = pdfPath + "#toolbar=0&navpanes=0&scrollbar=0"; 
            
            // 顯示 Modal 並鎖定背景滾動
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            
            // 加上微小的延遲來觸發淡入動畫
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closePDF() {
            const modal = document.getElementById('pdf-modal');
            const frame = document.getElementById('pdf-frame');
            
            // 觸發淡出動畫
            modal.classList.add('opacity-0');
            
            // 等動畫結束後再隱藏並清空來源
            setTimeout(() => {
                modal.classList.add('hidden');
                frame.src = ""; 
                document.body.style.overflow = 'auto'; // 恢復背景滾動
            }, 300);
        }
    </script>
</body>
</html>
