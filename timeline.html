<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline | Echo Sign</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">

    <div id="header-placeholder"></div>

    <section class="pt-32 pb-24 bg-[#FDFBF7] min-h-screen relative overflow-hidden">
        <div class="absolute top-20 left-10 w-72 h-72 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-20 right-10 w-72 h-72 bg-orange-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>

        <div class="max-w-3xl mx-auto px-4 relative z-10">
            <h1 class="text-4xl lg:text-5xl font-bold text-gray-800 text-center mb-16">發展歷程</h1>

            <div class="relative border-l-4 border-rose-200 ml-3 md:ml-6 space-y-12">

                <div class="relative pl-8 md:pl-10 group">
                    <div class="absolute -left-[11px] top-2 w-5 h-5 bg-rose-500 rounded-full border-4 border-white shadow-sm group-hover:scale-125 transition-transform duration-300"></div>
                    
                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-rose-50 hover:shadow-lg transition-shadow duration-300">
                        <span class="inline-block px-3 py-1 bg-rose-50 text-rose-500 rounded-full text-sm font-bold mb-4">2021 年</span>
                        <h3 class="text-2xl font-bold text-gray-800 mb-3">起心動念：看見隱形的需求</h3>
                        <p class="text-gray-600 leading-relaxed text-lg">
                            Megan Chen 在家收看電視新聞時，偶然看見了螢幕畫面的手語翻譯員...
                        </p>
                    </div>
                </div>

                <div class="relative pl-8 md:pl-10 group">
                    <div class="absolute -left-[11px] top-2 w-5 h-5 bg-orange-400 rounded-full border-4 border-white shadow-sm group-hover:scale-125 transition-transform duration-300"></div>
                    
                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-orange-50 hover:shadow-lg transition-shadow duration-300">
                        <span class="inline-block px-3 py-1 bg-orange-50 text-orange-500 rounded-full text-sm font-bold mb-4">2022 年 5 月</span>
                        <h3 class="text-2xl font-bold text-gray-800 mb-3">Echo Sign 正式啟動</h3>
                        <p class="text-gray-600 leading-relaxed text-lg">
                            我們製作了第一批手語圖卡...
                        </p>
                    </div>
                </div>

                </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
