<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Sign 小手傳愛</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">
    <div id="header-placeholder"></div>
    <section id="impact" class="py-20 bg-white shadow-inner relative z-20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                
                <div class="text-center mb-16">
                    <span class="text-rose-500 font-bold tracking-wider uppercase text-sm">Our Impact</span>
                    <h2 class="text-3xl font-bold text-gray-800 mt-2" data-i18n="impact_title">我們的影響力</h2>
                </div>

                <div class="flex flex-wrap justify-center gap-6 lg:gap-8">
                    
                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-rose-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-rose-500 mb-5 shadow-sm">
                            <i data-lucide="users" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="1000">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_1">接觸到的聽障人士</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-orange-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-orange-500 mb-5 shadow-sm">
                            <i data-lucide="book" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="800">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_2">捐贈給社群的書籍</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-yellow-50/80 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-yellow-500 mb-5 shadow-sm">
                            <i data-lucide="dollar-sign" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="5500" data-prefix="$">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_3">募集到的資金 (美金)</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-blue-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-blue-500 mb-5 shadow-sm">
                            <i data-lucide="handshake" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="6">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_4">企業/組織合作夥伴</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-purple-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-purple-500 mb-5 shadow-sm">
                            <i data-lucide="layers" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="350">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_5">發放的手語卡套組</div>
                    </div>

                </div>
            </div>
        </section>
        <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
