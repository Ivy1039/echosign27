    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const pdfModal = document.getElementById('pdf-modal');
        const pdfStage = document.getElementById('pdf-stage');
        const pdfCanvas = document.getElementById('pdf-canvas');
        const pdfLoading = document.getElementById('pdf-loading');

        let pdfDoc = null;
        let pdfPage = 1;
        let pdfLoadingTask = null;
        let pdfCloseTimer = null;
        // 共用一個 worker，關掉某本時不會連 worker 一起被銷毀，避免下一本卡在載入中
        const pdfWorker = new pdfjsLib.PDFWorker();

        // iPhone Safari 不支援元素全螢幕，沒有就把按鈕藏起來
        if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) {
            document.getElementById('pdf-fullscreen-btn').classList.add('hidden');
        }

        async function openPDF(pdfPath) {
            clearTimeout(pdfCloseTimer);
            pdfModal.classList.remove('hidden');
            pdfModal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            setTimeout(() => pdfModal.classList.remove('opacity-0'), 10);

            pdfDoc = null;
            pdfPage = 1;
            pdfCanvas.classList.add('invisible');
            pdfLoading.classList.remove('hidden');
            updateControls();

            const task = pdfjsLib.getDocument({ url: pdfPath, worker: pdfWorker });
            pdfLoadingTask = task;
            try {
                const doc = await task.promise;
                if (task !== pdfLoadingTask) return; // 已關閉或改開別本
                pdfDoc = doc;
                updateControls();
                renderPage();
            } catch (err) {
                if (task === pdfLoadingTask) {
                    // 讀不到就退回瀏覽器內建的 PDF 檢視
                    window.open(pdfPath, '_blank');
                    closePDF();
                }
            }
        }

        // 一次只畫一頁；畫的途中又翻頁，就等這頁畫完再畫最新那頁（同一個 canvas 不能同時 render）
        let pdfRendering = false;
        let pdfRenderPending = false;

        function renderPage() {
            if (!pdfDoc) return;
            if (pdfRendering) {
                pdfRenderPending = true;
                return;
            }
            drawPage();
        }

        async function drawPage() {
            pdfRendering = true;
            const doc = pdfDoc;
            try {
                const page = await doc.getPage(pdfPage);
                const base = page.getViewport({ scale: 1 });
                const style = getComputedStyle(pdfStage);
                const maxW = pdfStage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
                const maxH = pdfStage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
                const fit = Math.min(maxW / base.width, maxH / base.height);
                const dpr = window.devicePixelRatio || 1;
                const viewport = page.getViewport({ scale: fit * dpr });

                pdfCanvas.width = viewport.width;
                pdfCanvas.height = viewport.height;
                pdfCanvas.style.width = (viewport.width / dpr) + 'px';
                pdfCanvas.style.height = (viewport.height / dpr) + 'px';

                await page.render({ canvasContext: pdfCanvas.getContext('2d'), viewport }).promise;
                if (doc === pdfDoc) {
                    pdfLoading.classList.add('hidden');
                    pdfCanvas.classList.remove('invisible');
                }
            } catch (err) {
                console.error(err);
            } finally {
                pdfRendering = false;
                if (pdfRenderPending) {
                    pdfRenderPending = false;
                    renderPage();
                }
            }
        }

        function changePage(delta) {
            if (!pdfDoc) return;
            const next = pdfPage + delta;
            if (next < 1 || next > pdfDoc.numPages) return;
            pdfPage = next;
            updateControls();
            renderPage();
        }

        function updateControls() {
            const total = pdfDoc ? pdfDoc.numPages : 0;
            document.getElementById('pdf-counter').textContent = total ? pdfPage + ' / ' + total : '';
            document.getElementById('pdf-prev').disabled = !total || pdfPage <= 1;
            document.getElementById('pdf-next').disabled = !total || pdfPage >= total;
        }

        function isFullscreen() {
            return !!(document.fullscreenElement || document.webkitFullscreenElement);
        }

        function toggleFullscreen() {
            if (isFullscreen()) {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            } else {
                (pdfModal.requestFullscreen || pdfModal.webkitRequestFullscreen).call(pdfModal);
            }
        }

        function closePDF() {
            if (isFullscreen()) toggleFullscreen();
            if (pdfLoadingTask) pdfLoadingTask.destroy();
            pdfLoadingTask = null;
            pdfDoc = null;
            pdfModal.classList.add('opacity-0');
            pdfCloseTimer = setTimeout(() => {
                pdfModal.classList.add('hidden');
                pdfModal.classList.remove('flex');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        document.addEventListener('keydown', (e) => {
            if (pdfModal.classList.contains('hidden')) return;
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); changePage(1); }
            else if (e.key === 'ArrowLeft') changePage(-1);
            else if (e.key === 'Escape' && !isFullscreen()) closePDF();
        });

        // 手機左右滑動翻頁
        let touchStartX = null;
        pdfStage.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
        pdfStage.addEventListener('touchend', (e) => {
            if (touchStartX === null) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) > 50) changePage(dx < 0 ? 1 : -1);
            touchStartX = null;
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderPage, 150);
        });
        document.addEventListener('fullscreenchange', renderPage);
        document.addEventListener('webkitfullscreenchange', renderPage);
    </script>
</body>
</html>
