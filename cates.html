<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATES Student Leadership Conference | Echo Sign</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh bg-sky-50">

    <div id="header-placeholder"></div>

    <section class="pt-32 pb-24 bg-sky-50 min-h-screen relative overflow-hidden">
        <div class="absolute top-20 right-10 w-72 h-72 bg-sky-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="absolute bottom-20 left-10 w-72 h-72 bg-blue-100 rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">

            <div class="text-center mb-12">
                <span class="text-sky-600 font-bold tracking-wider uppercase text-sm">Our Programs</span>
                <h1 class="text-4xl lg:text-5xl font-bold text-gray-800 mt-2 mb-8" data-i18n="nav_CATES">CATES 學生領袖會議</h1>
                <div class="text-lg text-gray-600 max-w-4xl mx-auto leading-relaxed text-left space-y-4 bg-white/70 rounded-3xl p-6 md:p-10 shadow-sm" data-i18n="cates_page_desc"></div>
            </div>

            <div class="columns-1 sm:columns-2 lg:columns-3 gap-6">
                <img src="image/CATES/S__4857903_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857905_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857904_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857906_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857910_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857907_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857908_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857914_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857909_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857911_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857915_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
                <img src="image/CATES/S__4857912_0.jpg" alt="CATES 2026" loading="lazy" onclick="openPhoto(this.src)" class="w-full mb-6 rounded-2xl shadow-lg break-inside-avoid cursor-zoom-in hover:shadow-2xl hover:-translate-y-1 transition-all duration-500">
            </div>
        </div>
    </section>

    <div id="photo-modal" onclick="closePhoto()" class="fixed inset-0 z-[100] bg-black/80 hidden flex items-center justify-center backdrop-blur-md p-4 cursor-zoom-out">
        <img id="photo-full" src="" alt="CATES 2026" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl">
    </div>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
    <script>
        function openPhoto(src) {
            document.getElementById('photo-full').src = src;
            document.getElementById('photo-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closePhoto() {
            document.getElementById('photo-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
