<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Sign 小手傳愛</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">
    <div id="header-placeholder"></div>
    <section class="pt-32 pb-16 px-4 sm:px-6 lg:px-8 bg-orange-50/30 relative overflow-hidden">
        <div class="absolute top-20 -right-20 w-96 h-96 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
        <div class="absolute bottom-0 -left-20 w-96 h-96 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>
        <div class="max-w-6xl mx-auto relative z-10">
            <div class="text-center mb-12">
                <span class="text-rose-500 font-bold tracking-wider uppercase text-sm">Our Impact</span>
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mt-2" data-i18n="impact_title">我們的影響力</h1>
            </div>
            <div class="space-y-6 md:space-y-10">
                <div class="grid md:grid-cols-5 gap-6 md:gap-10 items-center">
                    <img src="image/Impact/S__5013547_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="md:col-span-3 w-full aspect-[4/3] object-cover rounded-3xl shadow-xl cursor-zoom-in">
                    <img src="image/Impact/S__5054526_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="md:col-span-2 w-full max-w-sm mx-auto aspect-[3/4] object-cover rounded-3xl shadow-xl cursor-zoom-in md:mt-16">
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 items-start">
                    <img src="image/Impact/S__5013548_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="w-full aspect-[4/3] object-cover rounded-2xl shadow-lg cursor-zoom-in">
                    <img src="image/Impact/S__5054527_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="w-full aspect-[4/3] object-cover rounded-2xl shadow-lg cursor-zoom-in md:mt-12">
                    <img src="image/Impact/S__5013546_0.jpg" alt="Echo Sign event" onclick="openPhoto(this.src)" class="col-span-2 md:col-span-1 w-full aspect-[4/3] object-cover rounded-2xl shadow-lg cursor-zoom-in">
                </div>
                <div class="grid md:grid-cols-5 gap-6 md:gap-10 items-center">
                    <img src="image/Impact/S__5054528_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="md:col-span-2 w-full max-w-sm mx-auto aspect-[3/4] object-cover rounded-3xl shadow-xl cursor-zoom-in">
                    <img src="image/Impact/S__5054533_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="md:col-span-3 w-full aspect-[4/3] object-cover rounded-3xl shadow-xl cursor-zoom-in">
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 items-start">
                    <img src="image/Impact/S__5054529_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="w-full aspect-[4/3] object-cover rounded-2xl shadow-lg cursor-zoom-in">
                    <img src="image/Impact/S__5054530_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="w-full aspect-[4/3] object-cover rounded-2xl shadow-lg cursor-zoom-in md:mt-12">
                    <img src="image/Impact/S__5054531_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="col-span-2 md:col-span-1 w-full aspect-[4/3] object-cover rounded-2xl shadow-lg cursor-zoom-in">
                </div>
                <div class="max-w-4xl mx-auto">
                    <img src="image/Impact/S__5054532_0.jpg" alt="Impact" onclick="openPhoto(this.src)" class="w-full aspect-[19/10] object-cover rounded-3xl shadow-xl cursor-zoom-in">
                </div>
            </div>
        </div>
    </section>

    <section id="impact" class="py-20 bg-white shadow-inner relative z-20">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                <div class="flex flex-wrap justify-center gap-6 lg:gap-8">
                    
                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-rose-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-rose-500 mb-5 shadow-sm">
                            <i data-lucide="users" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="1000">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_1">接觸到的聽障人士</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-orange-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-orange-500 mb-5 shadow-sm">
                            <i data-lucide="book" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="800">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_2">捐贈給社群的書籍</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-yellow-50/80 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-yellow-500 mb-5 shadow-sm">
                            <i data-lucide="dollar-sign" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="5500" data-prefix="$">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_3">募集到的資金 (美金)</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-blue-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-blue-500 mb-5 shadow-sm">
                            <i data-lucide="handshake" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="6">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_4">企業/組織合作夥伴</div>
                    </div>

                    <div class="w-full sm:w-[45%] lg:w-[30%] p-8 bg-purple-50/60 rounded-3xl text-center flex flex-col justify-center">
                        <div class="w-14 h-14 mx-auto bg-white rounded-full flex items-center justify-center text-purple-500 mb-5 shadow-sm">
                            <i data-lucide="layers" class="w-7 h-7"></i>
                        </div>
                        <div class="text-5xl font-extrabold text-gray-900 mb-3 counter-value tracking-tight" data-target="350">0</div>
                        <div class="text-sm text-gray-600 font-bold" data-i18n="impact_5">發放的手語卡套組</div>
                    </div>

                </div>
            </div>
        </section>
        <div id="photo-modal" onclick="closePhoto()" class="fixed inset-0 z-[100] bg-black/80 hidden flex items-center justify-center backdrop-blur-md p-4 cursor-zoom-out">
            <img id="photo-full" src="" alt="Echo Sign" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl">
        </div>

        <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
    <script>
        function openPhoto(src) {
            document.getElementById('photo-full').src = src;
            document.getElementById('photo-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closePhoto() {
            document.getElementById('photo-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
