<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Sign 小手傳愛</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">

    <div id="header-placeholder"></div>
    
    <section class="relative min-h-[85vh] lg:min-h-screen flex items-center overflow-hidden z-10 pt-32 pb-20">

        <!-- 滿版背景圖 + 色調遮罩，文字疊在上面 -->
        <img src="image/S__2211974.jpg" alt="Megan Chen - Founder" class="absolute inset-0 w-full h-full object-cover object-top z-0">
        <div class="absolute inset-0 z-10 bg-rose-950/45"></div>
        <div class="absolute inset-0 z-10 bg-gradient-to-r from-rose-950/70 via-rose-900/30 to-transparent"></div>

        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 relative z-20">
            <div class="max-w-3xl space-y-8 text-center lg:text-left mx-auto lg:mx-0 pt-10">

                <div class="inline-flex items-center px-4 py-2 rounded-full bg-white/15 border border-white/30 backdrop-blur-sm mb-4">
                    <span class="flex h-2 w-2 rounded-full bg-rose-300 mr-2"></span>
                    <span class="text-sm text-white font-medium" data-i18n="hero_badge">青年領軍的聾聽共融計畫</span>
                </div>

                <h1 class="text-5xl md:text-6xl lg:text-7xl font-bold leading-tight text-white drop-shadow-lg">
                    <span data-i18n="hero_title_1">讓每一份表達</span><br>
                    <span data-i18n="hero_title_2">都被</span><span class="text-rose-200" data-i18n="hero_title_highlight">溫柔聽見</span>
                </h1>

                <p class="text-xl text-white/90 leading-relaxed max-w-2xl mx-auto lg:mx-0 drop-shadow" data-i18n="hero_desc">
                    Echo Sign 致力於打破溝通隔閡。我們透過手語圖卡與繪本，搭建聾聽之間的橋樑，創造一個無障礙的溫暖世界。
                </p>

                <div class="flex flex-col sm:flex-row gap-4 justify-center lg:justify-start">
                    <a href="donate.html" class="px-8 py-4 rounded-full text-lg font-medium text-rose-600 bg-white hover:bg-rose-50 transition-all shadow-lg text-center">
                        <span data-i18n="hero_cta_primary">支持我們</span>
                    </a>
                    <a href="#our_story" class="px-8 py-4 rounded-full text-lg font-medium text-white border-2 border-white hover:bg-white/15 transition-all text-center">
                        <span data-i18n="hero_cta_secondary">了解更多</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <section id="our_story" class="py-24 relative overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-start">
                <div class="order-2 lg:order-1 relative sticky top-32">
                    <div class="absolute -top-4 -left-4 w-24 h-24 bg-yellow-200 rounded-full opacity-50 blur-xl"></div>
                    <img src="image/our_story.jpg" alt="Team activity" class="relative rounded-3xl shadow-2xl w-full object-cover h-[500px]">
                    <div class="absolute -bottom-6 -right-6 bg-white px-6 py-4 rounded-xl shadow-lg border border-gray-100">
                        <p class="font-bold text-rose-500 text-lg">Since 2022</p>
                        <p class="text-sm text-gray-500">Founded by Megan Chen</p>
                    </div>
                </div>
                <div class="order-1 lg:order-2 space-y-8">
                    <div>
                        <span class="text-rose-500 font-bold tracking-wider uppercase text-sm">Our Story</span>
                        <h2 class="text-3xl lg:text-4xl font-bold text-gray-800 mt-2" data-i18n="about_title">打破「隱形泡泡」的起點</h2>
                    </div>
                    
                    <div id="about-content" class="space-y-6 text-gray-600 leading-relaxed text-lg" data-i18n="about_content">
                    </div>

                    <!-- <div class="pt-4">
                        <a href="#" class="inline-flex items-center text-rose-500 font-bold hover:text-rose-600 transition-colors border-b-2 border-transparent hover:border-rose-200">
                            <span data-i18n="about_link">閱讀更多創辦故事</span> <i data-lucide="arrow-right" class="ml-2 w-5 h-5"></i>
                        </a>
                    </div> -->
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
