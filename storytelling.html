<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storytelling Program | Echo Sign</title>
    <link rel="icon" href="image/echosign_logo_circle.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased overflow-x-hidden lang-zh">

    <div id="header-placeholder"></div>

    <section class="pt-32 pb-24 bg-orange-50/30 min-h-screen relative overflow-hidden">
        <div class="absolute top-20 right-10 w-72 h-72 bg-yellow-200 rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
        <div class="absolute bottom-20 left-10 w-72 h-72 bg-rose-100 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            
            <div class="text-center mb-16">
                <span class="text-rose-500 font-bold tracking-wider uppercase text-sm">Our Lesson Plans</span>
                <h1 class="text-4xl lg:text-5xl font-bold text-gray-800 mt-2 mb-6" data-i18n="story_page_title">親子手語故事屋</h1>
                <p class="text-lg text-gray-600 max-w-3xl mx-auto leading-relaxed" data-i18n="story_page_desc">
                    這裡有我們最新製作的雙語教案！這些簡報專為聽障家庭設計，每次能提供 1-2 小時的互動故事體驗，同時幫助孩子們學習基礎英文單字。
                </p>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">

                <a href="path/to/your/pdf_file_1.pdf" target="_blank" class="group block cursor-pointer">
                    <div class="relative w-full aspect-[4/3] bg-white rounded-2xl shadow-md overflow-hidden transition-all duration-300 group-hover:-translate-y-2 group-hover:shadow-2xl">
                        <img src="image/S__2211974.jpg" alt="三隻比利羊封面" class="w-full h-full object-cover">
                        
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                            <span class="bg-white text-gray-800 px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 transform scale-90 group-hover:scale-100 transition-transform duration-300">
                                <i data-lucide="file-text" class="w-5 h-5 text-rose-500"></i> 開啟 PDF 教案
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-5 text-center">
                        <span class="inline-block px-3 py-1 bg-green-100 text-green-600 rounded-full text-xs font-bold mb-2 tracking-wider">魔法 ABC</span>
                        <h3 class="text-2xl font-bold text-gray-800 group-hover:text-rose-500 transition-colors">三隻比利羊</h3>
                        <p class="text-gray-500 mt-2 text-sm">Megan 姐姐設計製作</p>
                    </div>
                </a>

                <a href="path/to/your/pdf_file_2.pdf" target="_blank" class="group block cursor-pointer">
                    <div class="relative w-full aspect-[4/3] bg-white rounded-2xl shadow-md overflow-hidden transition-all duration-300 group-hover:-translate-y-2 group-hover:shadow-2xl">
                        <img src="image/iZmxC6.jpg" alt="我把媽媽弄丟了封面" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 backdrop-blur-sm">
                            <span class="bg-white text-gray-800 px-6 py-3 rounded-full font-bold shadow-lg flex items-center gap-2 transform scale-90 group-hover:scale-100 transition-transform duration-300">
                                <i data-lucide="file-text" class="w-5 h-5 text-rose-500"></i> 開啟 PDF 教案
                            </span>
                        </div>
                    </div>
                    <div class="mt-5 text-center">
                        <span class="inline-block px-3 py-1 bg-green-100 text-green-600 rounded-full text-xs font-bold mb-2 tracking-wider">魔法 ABC</span>
                        <h3 class="text-2xl font-bold text-gray-800 group-hover:text-rose-500 transition-colors">我把媽媽弄丟了</h3>
                        <p class="text-gray-500 mt-2 text-sm">Megan 姐姐設計製作</p>
                    </div>
                </a>

                </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="language.js"></script>
    <script src="main.js"></script>
</body>
</html>
